      <text x="564" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Sprint İş Akışı (Kanban)</text>
      <text x="564" y="48" fill="#94a3b8" font-family="sans-serif" font-size="11">Gerçek zamanlı görev ve aşama orkestrasyonu</text>

      <!-- Mini Task Card 1 -->
      <rect x="564" y="68" width="472" height="62" rx="10" fill="#0f172a" stroke="#334155" />
      <rect x="578" y="78" width="62" height="16" rx="8" fill="#e11d48" opacity="0.2" />
      <text x="588" y="90" fill="#f43f5e" font-family="sans-serif" font-size="9" font-weight="700">KRİTİK</text>
      <text x="650" y="90" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Dağıtık Oturum Yönetimi &amp; Redis Token</text>
      <text x="578" y="118" fill="#64748b" font-family="sans-serif" font-size="10">Can Aksoy • Siber Güvenlik • 9/16 saat</text>

      <!-- Mini Task Card 2 -->
      <rect x="564" y="140" width="472" height="62" rx="10" fill="#0f172a" stroke="#334155" />
      <rect x="578" y="150" width="68" height="16" rx="8" fill="#3b82f6" opacity="0.2" />
      <text x="588" y="162" fill="#60a5fa" font-family="sans-serif" font-size="9" font-weight="700">FRONTEND</text>
      <text x="655" y="162" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Kokpit Gerçek Zamanlı Metrik Grafikleri</text>
      <text x="578" y="190" fill="#64748b" font-family="sans-serif" font-size="10">Deniz Yılmaz • UI/UX • 6/12 saat</text>

      <!-- Mini Task Card 3 -->
      <rect x="564" y="212" width="472" height="62" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.5" />
      <rect x="578" y="222" width="80" height="16" rx="8" fill="#10b981" opacity="0.2" />
      <text x="588" y="234" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">TAMAMLANDI</text>
      <text x="668" y="234" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Tasarım Sistemi v3.0 Renk Tokenları</text>
      <text x="578" y="262" fill="#64748b" font-family="sans-serif" font-size="10">Selin Demir • UI/UX • 8/8 saat</text>
