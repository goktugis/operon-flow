      <text x="18" y="26" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">SPRINT TAMAMLANMA</text>
      <text x="18" y="62" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="800">%95</text>
