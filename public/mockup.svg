    <circle cx="28" cy="27" r="6" fill="#ef4444" />
    <circle cx="48" cy="27" r="6" fill="#f59e0b" />
    <circle cx="68" cy="27" r="6" fill="#10b981" />

    <!-- App Logo & Title in Header -->
    <rect x="95" y="14" width="28" height="28" rx="8" fill="#6366f1" />
    <path d="M109 20 L115 32 L103 32 Z" fill="#ffffff" />
    <text x="133" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="16" letter-spacing="1">OPERON FLOW</text>
    <rect x="260" y="18" width="65" height="18" rx="9" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <text x="272" y="31" fill="#c7d2fe" font-family="sans-serif" font-size="10" font-weight="700">v2.4 CORE</text>

