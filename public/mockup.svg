      <rect x="0" y="0" width="80" height="26" rx="8" fill="#6366f1" />
      <text x="18" y="17" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Kokpit</text>
      
      <rect x="90" y="0" width="105" height="26" rx="8" fill="#334155" opacity="0.5" />
      <text x="105" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11">Sprint Panosu</text>
      
      <rect x="205" y="0" width="95" height="26" rx="8" fill="#334155" opacity="0.5" />
      <text x="218" y="17" fill="#cbd5e1" font-family="sans-serif" font-size="11">Operon AI</text>
      
