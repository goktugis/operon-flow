      <text x="260" y="258" fill="#64748b" font-family="sans-serif" font-size="11">Çar</text>
      <text x="370" y="258" fill="#64748b" font-family="sans-serif" font-size="11">Per</text>
      <text x="475" y="258" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">Cum</text>

